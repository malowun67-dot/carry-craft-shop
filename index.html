<meta charset="utf-8">

<title>Sakura Shop – CarryCraft</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--ink:#4a2a38;--mut:#9a7283;--pink:#f28bb0;--pink2:#ffd6e5;--line:#f8dce8;--ok:#3a9d6b;--bad:#d2486b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#24131b;--card:#33202a;--ink:#ffe9f1;--mut:#c79bae;--pink:#f58db4;--pink2:#5a2d42;--line:#4a2c3a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#24131b;--card:#33202a;--ink:#ffe9f1;--mut:#c79bae;--pink:#f58db4;--pink2:#5a2d42;--line:#4a2c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{background:linear-gradient(120deg,var(--pink2),var(--card));border-bottom:2px solid var(--pink);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-size:1.4rem;font-weight:800;color:var(--pink)}.logo small{display:block;font-size:.7rem;color:var(--mut);font-weight:500}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
button,input,select{font:inherit}
.btn{background:var(--pink);color:#fff;border:0;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--card);color:var(--pink);border:1.5px solid var(--pink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.on{outline:3px solid var(--pink2)}
main{max-width:1000px;margin:auto;padding:18px}
input,select{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--pink);transform:translateY(-2px)}
.item .ic{font-size:1.8rem}.item b{display:block;font-size:.85rem;margin:4px 0}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.hero{text-align:center;padding:30px 10px}.hero h1{color:var(--pink);margin:0 0 6px}
.tag{display:inline-block;border-radius:10px;padding:2px 10px;font-size:.8rem;font-weight:700}
.pending{background:#fff0b8;color:#7a5b00}.accepted{background:#d4f2e2;color:#1d6b43}.rejected{background:#ffd9e1;color:#a02347}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.chat{max-height:240px;overflow:auto;background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
.m{margin:5px 0;padding:7px 11px;border-radius:14px;max-width:80%;background:var(--pink2);width:fit-content}
.m.me{margin-left:auto;background:var(--pink);color:#fff}.m small{display:block;opacity:.7;font-size:.7rem}
.cart{position:sticky;bottom:10px}
.petal{position:fixed;top:-30px;font-size:18px;pointer-events:none;animation:fall linear infinite;z-index:1;opacity:.7}
@keyframes fall{to{transform:translate(60px,110vh) rotate(360deg)}}
.mut{color:var(--mut);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.petal{display:none}}
:root:root:root{--bg:#09050f;--card:rgba(28,16,44,.72);--ink:#f4eaff;--mut:#a893c9;--pink:#ff3fb0;--pink2:#2a1245;--line:rgba(255,63,176,.28);--ok:#19f0a0;--bad:#ff3d6e;--cy:#19e8ff;color-scheme:dark}
body{font-family:"Poppins","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 500px at 10% -10%,rgba(255,63,176,.3),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(25,232,255,.22),transparent 60%),var(--bg);background-attachment:fixed}
body::before{background:var(--bg)}
header{background:rgba(14,7,24,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--pink);box-shadow:0 0 26px rgba(255,63,176,.5)}
.logo{font-family:"Orbitron","Segoe UI",sans-serif;background:linear-gradient(90deg,#ff3fb0,#19e8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,63,176,.7));letter-spacing:1px}
.logo small{color:var(--mut);-webkit-text-fill-color:var(--mut);letter-spacing:0}
.btn{background:linear-gradient(90deg,#ff3fb0,#9b4bff);box-shadow:0 0 14px rgba(255,63,176,.6);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(255,63,176,.95)}
.btn.alt{background:transparent;color:var(--cy);border:1.5px solid var(--cy);box-shadow:0 0 10px rgba(25,232,255,.4)}
.btn.ok{background:linear-gradient(90deg,#19f0a0,#19c3ff);color:#04140e;box-shadow:0 0 14px rgba(25,240,160,.6)}

.card,.item{backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(255,63,176,.12)}
.item{--g:var(--pink)}
.item:hover{border-color:var(--g);box-shadow:0 0 20px var(--g);transform:translateY(-3px) scale(1.03)}
.ic svg{width:56px;height:56px;image-rendering:pixelated;filter:drop-shadow(0 0 7px var(--g))}
.item b{font-size:.8rem}
.item{cursor:default}.item.in{border-color:var(--pink);box-shadow:0 0 16px rgba(255,63,176,.55)}
.item.off{filter:grayscale(1);opacity:.45;pointer-events:none;box-shadow:none}
.soon{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:10px;border:1px dashed var(--mut);color:var(--mut);font-size:.8rem;font-weight:700}
.qty{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--cy);background:transparent;color:var(--cy);cursor:pointer;font-weight:700;box-shadow:0 0 8px rgba(25,232,255,.35)}
.qty input{width:58px;text-align:center;padding:4px;border-radius:8px}
textarea{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit}
.ov{position:fixed;inset:0;background:rgba(5,2,10,.78);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg{background:var(--bg);border:1.5px solid var(--pink);box-shadow:0 0 30px rgba(255,63,176,.5);border-radius:18px;padding:16px;width:min(520px,100%);max-height:88vh;overflow:auto}
.dlg .ic svg{width:44px;height:44px}.dlg h3{margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--pink);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 0 20px rgba(255,63,176,.5);max-width:90vw}
#toast.show{opacity:1}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.dlg h4{margin:8px 0}
.pl summary{cursor:pointer;font-weight:600}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.sb{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px}.sb b{display:block;font-size:1.05rem;color:var(--cy)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:12px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.7rem;color:var(--mut)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--cy),var(--pink));border-radius:4px 4px 0 0;min-height:2px;box-shadow:0 0 8px rgba(25,232,255,.5)}

.thumb{max-width:100%;max-height:180px;border-radius:10px;margin-top:6px;border:1px solid var(--line)}

.ic.em{font-size:2.3rem}.f{display:block;width:100%;margin:4px 0 10px}
.er{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.done{background:rgba(25,232,255,.14);color:#19e8ff;box-shadow:0 0 8px rgba(25,232,255,.4)}
.claim{background:rgba(155,75,255,.18);color:#c9a2ff}

input:focus{outline:0;border-color:var(--cy);box-shadow:0 0 12px rgba(25,232,255,.5)}
.hero h1,h2{text-shadow:0 0 18px var(--pink)}
.pending{background:rgba(255,224,74,.14);color:#ffe04a;box-shadow:0 0 8px rgba(255,224,74,.4)}
.accepted{background:rgba(25,240,160,.14);color:#19f0a0;box-shadow:0 0 8px rgba(25,240,160,.4)}
.rejected{background:rgba(255,61,110,.14);color:#ff6b8f;box-shadow:0 0 8px rgba(255,61,110,.4)}
.chat{background:rgba(0,0,0,.35)}.m{background:rgba(255,255,255,.09)}.m.me{background:linear-gradient(90deg,#ff3fb0,#9b4bff)}

function enchFor(id){
  const P=["protection","fire_protection","blast_protection","projectile_protection","thorns"],B=["unbreaking","mending","curse_of_vanishing"],t=x=>x.test(id);let l=[];
  if(t(/helmet$/))l=[...P,"respiration","aqua_affinity","curse_of_binding"];
  else if(t(/_chestplate$/))l=[...P,"curse_of_binding"];
  else if(t(/_leggings$/))l=[...P,"swift_sneak","curse_of_binding"];
  else if(t(/_boots$/))l=[...P,"feather_falling","depth_strider","frost_walker","soul_speed","curse_of_binding"];
  else if(id==="elytra")l=["curse_of_binding"];
  else if(t(/_sword$/))l=["sharpness","smite","bane_of_arthropods","knockback","fire_aspect","looting","sweeping_edge"];
  else if(t(/_axe$/))l=["sharpness","smite","bane_of_arthropods","efficiency","silk_touch","fortune"];
  else if(t(/_(pickaxe|shovel|hoe)$/))l=["efficiency","silk_touch","fortune"];
  else if(id==="bow")l=["power","punch","flame","infinity"];
  else if(id==="crossbow")l=["quick_charge","multishot","piercing"];
  else if(id==="trident")l=["loyalty","riptide","impaling","channeling"];
  else if(id==="fishing_rod")l=["luck_of_the_sea","lure"];
  else if(id==="shears")l=["efficiency"];
  else if(id==="mace")l=["density","breach","smite","bane_of_arthropods","wind_burst","fire_aspect"];
  return l.length||id==="shield"?[...l,...B]:[];
}

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const aid=n=>n.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
async function adminLogin(){
  const id=aid($("#aname").value),pw=$("#apw").value,er=$("#aerr");
  if(!id||!pw){er.textContent="Name und Passwort eingeben.";return}
  try{
    if(S.db){
      const d=await S.db.doc("admins/"+id).get(),x=d.exists&&d.data();
      if(!x||await sha(x.salt+pw)!==x.hash){er.textContent="Name oder Passwort falsch.";return}
      S.admin=true;S.adminName=x.name;put("cc_adm",id);render();return;
    }
    const local=JSON.parse(get("cc_local_admins")||"{}")[id];
    if(!local||await sha(local.salt+pw)!==local.hash){er.textContent="Kein passender lokaler Admin. Datenbank nicht verbunden? Du kannst einen lokalen Admin-Account erstellen.";return}
    S.admin=true;S.adminName=local.name;put("cc_adm",id);render();
  }catch(e){er.textContent="Login fehlgeschlagen: "+(e.message||e.code||"Unbekannter Fehler")}
}
async function adminReg(){
  const n=$("#aname").value.trim(),id=aid(n),pw=$("#apw").value,er=$("#aerr");
  if(!id||pw.length<4){er.textContent="Name und Passwort (mind. 4 Zeichen) eingeben.";return}
  if($("#acode").value!==ADMIN_PW){er.textContent="Falscher Admin-Code.";return}
  try{
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36),hash=await sha(salt+pw);
    if(S.db){
      const ref=S.db.doc("admins/"+id);if((await ref.get()).exists){er.textContent="Diesen Admin-Namen gibt es schon.";return}
      await ref.set({name:n.slice(0,20),salt,hash,ts:Date.now()});
    }else{
      const admins=JSON.parse(get("cc_local_admins")||"{}");
      if(admins[id]){er.textContent="Diesen Admin-Namen gibt es schon.";return}
      admins[id]={name:n.slice(0,20),salt,hash,ts:Date.now()};put("cc_local_admins",JSON.stringify(admins));
    }
    S.admin=true;S.adminName=n.slice(0,20);put("cc_adm",id);render();
  }catch(e){er.textContent="Registrierung fehlgeschlagen: "+(e.message||e.code||"Unbekannter Fehler")}
}

async function submitB(){

const SEED=["travao","evilguy8889","schechlerr","LeandroLeonardo_","WRDN_BANK","Hitdefender","Like_Malox","Luiluk2012","MrJhnyz_","QuigonGin2","Badmann_Louis","Mr5ocks2345","Lekopa_Jam","Benser5PH","notNoahYT22","Snowedy","LeonardoLeandro_","King_Norax","codeKevi","allesklar73","Finnibobi123_","uncguhl","Pixelkillnoob","kniepeltoni","lekopa_jam_","kakaotrinker67"];

{let n=0;const t=setInterval(()=>{if(S.db){clearInterval(t);

function blockInfo(){
  if(!S.me||!S.wlReady)return null;

function loginView(a){
  a.innerHTML=`<div class="card hero"><h1>🌸 Willkommen im Sakura Shop</h1><p>Der Shop des Sakura Teams für den Minecraft-Server <b>CarryCraft</b>.<br>Melde dich mit deinem Minecraft-Namen an – nur Spieler auf der Whitelist können bestellen.</p><div class="row" style="justify-content:center"><input id="mcname" placeholder="Minecraft-Username" maxlength="16" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Anmelden</button></div><p id="lerr" class="mut"></p></div>`;
}
function login(){
  const n=$("#mcname").value.trim(),e=$("#lerr");
  if(!S.wlReady && S.db){e.textContent="Whitelist wird geladen … bitte kurz warten.";return}

  if(!w){e.textContent="Dieser Name steht nicht auf der Whitelist von CarryCraft.";return}

{const _r2=render;render=function(){
  const b=blockInfo();S._bk=JSON.stringify(b);

    $("#app").innerHTML=`<div class="card hero"><h1>${b.t==="ban"?"🚫 Gebannt":b.t==="to"?"⏱️ Timeout":"🌸 Kein Zugang"}</h1><p>${b.t==="ban"?"Du wurdest vom Sakura Shop gebannt.":b.t==="to"?"Du hast einen Timeout bis <b>"+new Date(b.u).toLocaleString("de-DE")+"</b>.":"Dein Name steht nicht (mehr) auf der Whitelist."}${b.r?"<br>Grund: "+esc(b.r):""}</p><button class="btn alt" onclick="logout()">Abmelden</button></div>`;return}
  _r2()}}
setInterval(()=>{if(S.me&&JSON.stringify(blockInfo())!==S._bk)render()},15000);
const reason=()=>$("#preason")?$("#preason").value.trim().slice(0,80):"";
async function pPut(n,patch){const id=n.toLowerCase();try{await S.db.doc("players/"+id).set({...(S.players[id]||{}),name:n,...patch})}catch(e){toast("Fehler: "+(e.message||e.code))}}

function pTO(n,m){const min=m===0?0:parseInt($("#to_"+n.toLowerCase()).value);pPut(n,{until:min?Date.now()+min*60000:0,reason:min?reason():"",by:S.adminName})}
async function wlAdd(){const n=$("#wadd").value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n)){toast("Ungültiger Minecraft-Name.");return}

async function wlRem(n){try{await S.db.doc("whitelist/"+n.toLowerCase()).set({name:n,removed:true});toast(n+" entfernt.")}catch(e){toast("Fehler: "+(e.message||e.code))}}
function pRow(n){

  <button class="btn alt" onclick="wlRem('${n}')">✕ Whitelist</button></div></div>`;
}
function pList(){const q=(S.pq||"").toLowerCase();return allWL().filter(n=>n.toLowerCase().includes(q)).map(pRow).join("")||'<div class="card mut">Keine Spieler.</div>'}
function pFilter(){const l=$("#plist");if(l)l.innerHTML=pList()}

}
admin=function(a){
  if(!S.admin){const r=S.areg;
    a.innerHTML=`<div class="card hero"><h2>🔑 Admin ${r?"registrieren":"Login"}</h2><div class="row" style="justify-content:center"><input id="aname" placeholder="Admin-Name" maxlength="20"><input id="apw" type="password" placeholder="Passwort" onkeydown="if(event.key==='Enter')${r?"adminReg":"adminLogin"}()">${r?`<input id="acode" type="password" placeholder="Admin-Code">`:""}<button class="btn" onclick="${r?"adminReg":"adminLogin"}()">${r?"Account erstellen":"Login"}</button></div><p id="aerr" class="mut"></p><button class="btn alt" onclick="S.areg=!S.areg;render()">${r?"← Zum Login":"Neuer Admin? Account erstellen"}</button></div>`;return}

  if(tab==="players"){a.innerHTML=head+playersPanel();return}
  const L=S.orders.filter(o=>ty(o)===tab&&(af==="all"||o.status===af)),fb=(v,t)=>`<button class="btn ${af===v?"":"alt"}" onclick="S.af='${v}';render()">${t}</button>`;

function schemHtml(o,adm){
  const s=o.schem;if(!s)return `<p class="mut">📐 Keine Schematic / kein Bild</p>`;
  return `<p class="mut">📐 ${s.kind==="image"?"Bild":"Schematic"}: ${esc(s.name||"")}${s.link?" "+esc(s.link):""} ${adm&&s.assetId?`<button class="btn alt" onclick="dlSchem('${o.id}')">⬇️ Herunterladen</button>`:""}${s.kind==="image"&&s.assetId?`<br><img class="thumb" src="/_blob/${s.assetId}" alt="">`:""}</p>`;
}
async function dlSchem(id){
  const o=S.orders.find(x=>x.id===id);if(!o||!o.schem||!o.schem.assetId)return;
  if(!S.dl){toast("Download ist hier nicht verfügbar.");return}
  try{const r=await fetch("/_blob/"+o.schem.assetId);let data;
    if(o.schem.kind==="image")data=await r.blob();
    else{const bin=atob((await r.text()).trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);data=new Blob([u])}
    await S.dl.save({filename:o.schem.name||"schematic.schem",data})}catch(e){toast("Download fehlgeschlagen: "+(e.message||e.code||e))}
}

  }
}
async function submitB(){
  const B=S.b,b=BUILDS.find(x=>x[0]===B.id),btn=$("#wbtn"),g=i=>$(i)?$(i).value:"";btn.disabled=true;btn.textContent="Wird gesendet …";

    const o={user:S.me,type:"build",items:[{id:"build_"+b[0],n:name,q:1}],coords:g("#bc").slice(0,80),desc:g("#bd").slice(0,300),note:"",status:"pending",ts:Date.now()};
